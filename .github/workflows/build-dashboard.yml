name: Build dashboard

on:
  schedule:
    # 15:00 UTC daily.
    - cron: '0 15 * * *'
  workflow_dispatch:
  # Rebuild immediately on edits to main, so adding a repo to repos.yaml
  # shows up without waiting for the next scheduled run.
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-deployed
# Pages site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Generate dashboard
        env:
          # Sufficient for public target repos. A private target repo would
          # need a fine-grained PAT here instead — see README.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run repo-status generate --config config/repos.yaml --out dist/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
